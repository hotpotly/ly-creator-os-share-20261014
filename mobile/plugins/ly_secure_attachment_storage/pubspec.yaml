name: ly_secure_attachment_storage
description: Private Android Keystore-backed attachment chunk storage for LY Creator.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.ly.creatoros.secure_attachment_storage
        pluginClass: SecureAttachmentStoragePlugin
